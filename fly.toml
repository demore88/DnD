# fly.toml app configuration file generated for rollcall-dnd on 2026-11-26T05:09:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rollcall-dnd'
primary_region = 'ewr'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
